<svg width="1500" height="980" viewBox="0 0 1500 980" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: 700 32px 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #111111; }
      .subtitle { font: 20px 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #111111; }
      .head { font: 700 22px 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #111111; }
      .cell { font: 20px 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #111111; }
      .cell-bold { font: 700 20px 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #111111; }
      .note { font: 18px 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #111111; }
      .frame { fill: #FFFFFF; stroke: #111111; stroke-width: 2.2; }
      .line { stroke: #111111; stroke-width: 2; }
      .thin { stroke: #111111; stroke-width: 1.4; }
      .shade { fill: #F2F2F2; stroke: #111111; stroke-width: 2; }
    </style>
  </defs>

  <rect x="1" y="1" width="1498" height="978" class="frame"/>
  <text x="750" y="62" text-anchor="middle" class="title">PyFlowFusion 与 Lib/test 覆盖率对比结果表</text>
  <text x="750" y="102" text-anchor="middle" class="subtitle">统一口径：基于 gcovr XML 的逐行比较；当前可比的有效行总数为 305,516</text>

  <rect x="120" y="150" width="1260" height="620" class="frame"/>

  <rect x="120" y="150" width="1260" height="88" class="shade"/>

  <line x1="120" y1="238" x2="1380" y2="238" class="line"/>
  <line x1="120" y1="346" x2="1380" y2="346" class="thin"/>
  <line x1="120" y1="454" x2="1380" y2="454" class="thin"/>
  <line x1="120" y1="562" x2="1380" y2="562" class="thin"/>
  <line x1="120" y1="670" x2="1380" y2="670" class="thin"/>
  <line x1="120" y1="770" x2="1380" y2="770" class="line"/>

  <line x1="470" y1="150" x2="470" y2="770" class="line"/>
  <line x1="770" y1="150" x2="770" y2="770" class="line"/>
  <line x1="1030" y1="150" x2="1030" y2="770" class="line"/>

  <text x="295" y="204" text-anchor="middle" class="head">覆盖区域</text>
  <text x="620" y="204" text-anchor="middle" class="head">代码行数</text>
  <text x="900" y="204" text-anchor="middle" class="head">占有效行比例</text>
  <text x="1205" y="204" text-anchor="middle" class="head">覆盖含义</text>

  <text x="295" y="301" text-anchor="middle" class="cell-bold">二者都能覆盖</text>
  <text x="620" y="301" text-anchor="middle" class="cell">187,991</text>
  <text x="900" y="301" text-anchor="middle" class="cell">61.53%</text>
  <text x="1205" y="288" text-anchor="middle" class="cell">PyFlowFusion 与 Lib/test</text>
  <text x="1205" y="316" text-anchor="middle" class="cell">均在本次运行中触发</text>

  <text x="295" y="409" text-anchor="middle" class="cell-bold">仅 Lib/test 覆盖</text>
  <text x="620" y="409" text-anchor="middle" class="cell">53,874</text>
  <text x="900" y="409" text-anchor="middle" class="cell">17.63%</text>
  <text x="1205" y="396" text-anchor="middle" class="cell">官方测试默认 unittest</text>
  <text x="1205" y="424" text-anchor="middle" class="cell">覆盖到而 PyFlowFusion 未触发</text>

  <text x="295" y="517" text-anchor="middle" class="cell-bold">仅 PyFlowFusion 覆盖</text>
  <text x="620" y="517" text-anchor="middle" class="cell">437</text>
  <text x="900" y="517" text-anchor="middle" class="cell">0.14%</text>
  <text x="1205" y="504" text-anchor="middle" class="cell">动态生成程序触发的运行时</text>
  <text x="1205" y="532" text-anchor="middle" class="cell">异常分支与边界路径</text>

  <text x="295" y="625" text-anchor="middle" class="cell-bold">二者都未覆盖</text>
  <text x="620" y="625" text-anchor="middle" class="cell">63,214</text>
  <text x="900" y="625" text-anchor="middle" class="cell">20.69%</text>
  <text x="1205" y="612" text-anchor="middle" class="cell">两次具体运行均未触达</text>
  <text x="1205" y="640" text-anchor="middle" class="cell">不代表理论上永久不可达</text>

  <text x="295" y="727" text-anchor="middle" class="cell-bold">有效行总数</text>
  <text x="620" y="727" text-anchor="middle" class="cell-bold">305,516</text>
  <text x="900" y="727" text-anchor="middle" class="cell-bold">100.00%</text>
  <text x="1205" y="727" text-anchor="middle" class="cell">本次统一口径下的可比代码行集合</text>

  <text x="120" y="840" class="note">注1：比较口径为同一批 gcovr XML 逐行对齐后的结果，未将“理论可达性”与“本次运行是否触发”混为一谈。</text>
  <text x="120" y="876" class="note">注2：Lib/test 在本文中指本次默认 unittest 方式运行的 CPython 官方测试集；PyFlowFusion 指 24 小时最终覆盖快照。</text>
  <text x="120" y="912" class="note">注3：该表用于论文“结果与分析”章节，可与韦恩图配套使用以解释二者在核心路径、模块边界与异常分支上的差异。</text>
</svg>
